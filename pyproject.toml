[project]
name = "myclipfactory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1",
  "numpy>=2,<3", "cryptography>=44,<51",
  "faster-whisper>=1.1,<2", "opencv-python-headless>=4.10,<5",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["clipfactory*"]

[tool.setuptools.package-data]
clipfactory = ["static/*"]
